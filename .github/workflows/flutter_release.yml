name: Flutter Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: flutter-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-release:
    name: Build Android release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Generate Android platform project
        run: flutter create --platforms=android --org com.forgelabs --project-name fitforge .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Verify release artifacts
        run: |
          test -f build/app/outputs/bundle/release/app-release.aab
          test -n "$(find build/app/outputs/flutter-apk -name '*-release.apk' -print -quit)"

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: fitforge-android-aab-${{ github.ref_name }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: fitforge-android-apks-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 14
