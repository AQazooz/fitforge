name: FitForge Web Preview

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main, 'codex/fitforge-design-phase-2']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Enable Flutter Web
        run: flutter config --enable-web

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Web preview
        run: |
          flutter build web --release \
            --base-href "/FitForge/" \
            --dart-define=FITFORGE_DEMO_MODE=true

      - name: Upload web preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitforge-web-preview-${{ github.sha }}
          path: build/web
          if-no-files-found: error
          retention-days: 14
